name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: app
        run: npx tsc -b

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Smoke test
        working-directory: app
        run: npm run smoke

      # --publish never：发布交给下面的 action，避免 electron-builder 抢先建出一个没有说明的 Release
      - name: Build exe
        working-directory: app
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PenMods-Installer-windows
          path: |
            app/release/*.exe
          if-no-files-found: error

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: node tools/release-notes.mjs ${{ github.ref_name }}

      # 用 gh 而不是 action-gh-release：Release 已存在时 gh release edit 一定会覆盖说明，
      # 而 action-gh-release 遇到已有 Release 时是否更新 body 取决于内部逻辑，实测会留空。
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "PenMods 安装器 $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "PenMods 安装器 $TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" app/release/*.exe app/release/*.yml app/release/*.blockmap --clobber
